<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats preview card</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <picture class="card-image">
                <source media="(min-width:700px)" srcset="./images/image-header-desktop.jpg">
                <img src="./images/image-header-mobile.jpg" alt="Decorative header"/>
            </picture>
            <div class="card-content">
                <h1 class="class-title">Get <span class="accent"> insights</span> that help your business grow.</h1>
                <p>Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
                <ul class="stats">
                    <li class="stat">
                        <span class="stat-value">10k+</span>
                        <span class="stat-label">Companies</span>
                    </li>
                    <li class="stat">
                        <span class="stat-value">314</span>
                        <span class="stat-label">Templates</span>
                    </li>
                    <li class="stat">
                        <span class="stat-value">12M+</span>
                        <span class="stat-label">Queries</span>
                    </li>
                </ul>
            </div>
        </section>
        <footer class="attribution">
            Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
            Coded by <a href="https://github.com/BrianCyrus-Cypher">Brian Mwangi</a>.
        </footer>
    </main>    
</body>
</html>
